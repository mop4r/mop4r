name: Update Profile Visuals

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Run generator unit tests
        run: python -m unittest discover -s scripts -p "test_*.py" -v

      - name: Update custom telemetry SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -I scripts/generate_assets.py --user mop4r --out assets

      - name: Generate contribution snake SVGs (dark & light)
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: mop4r
          outputs: |
            assets/snake-light.svg
            assets/snake-dark.svg?palette=github-dark

      - name: Commit updated assets if changed
        run: |
          git config user.name "mop4r"
          git config user.email "40621159+mop4r@users.noreply.github.com"
          git add assets/
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Update profile telemetry and contribution snake SVGs"
          git push origin main
